# Lighttpd proxy configuration for Remote Pi Relay on relay.example.com
# Location on proxy host: /etc/lighttpd/conf-available/14-proxy-remote-pi.conf
# Enabled via: ln -s /etc/lighttpd/conf-available/14-proxy-remote-pi.conf /etc/lighttpd/conf-enabled/

server.modules += ( "mod_proxy", "mod_rewrite" )

$HTTP["url"] =~ "^/remote-pi" {
    # CORS headers for cross-origin browser clients (e.g. web app on http://web.example.com/remote-pi/)
    setenv.add-response-header += (
        "Access-Control-Allow-Origin" => "*",
        "Access-Control-Allow-Methods" => "GET, POST, OPTIONS",
        "Access-Control-Allow-Headers" => "Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since",
        "Access-Control-Max-Age" => "1728000"
    )

    # Intercept OPTIONS preflight requests directly and respond with 200 OK
    # instead of proxying to the Axum backend (which returns 405 without CORS headers).
    $HTTP["request-method"] == "OPTIONS" {
        url.rewrite-once = ( ".*" => "/remote-pi/cors-options" )
    }

    # Proxy all other requests (WebSocket, GET, POST) to remote-pi-relay container on docker-host
    $HTTP["request-method"] != "OPTIONS" {
        proxy.server = (
            "" => (
                "relay.example.com" => (
                    "host" => "10.0.0.10",
                    "port" => 3001,
                    "read-timeout" => 0,
                    "write-timeout" => 0
                )
            )
        )
        proxy.replace-http-host = "enable"
        proxy.forwarded = ( "for" => 1 )
        proxy.header = (
            "https-remap" => "enable",
            "upgrade" => "enable",
            "map-urlpath" => (
                "/remote-pi/" => "/",
                "/remote-pi" => "/",
            ),
        )
    }
}
